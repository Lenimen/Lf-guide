# Met en ligne le dossier app/ (web app LF Coaching) sur GitHub Pages à chaque modification sur main.
# Domaine : app.thelfmethod.com (réglé dans Settings > Pages, DNS OVH : CNAME app -> lenimen.github.io).
name: App en ligne
on:
  push:
    branches: [main]
    paths: ['app/**', 'mensurations.html', 'potentiel.html', 'posing.html', '.github/workflows/app-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir -p _site
          rsync -a --exclude 'LISEZ-MOI.md' app/ _site/
          # Guides publics affichés dans l'app (même fichier que sur Systeme.io : une seule source)
          mkdir -p _site/guides && cp mensurations.html potentiel.html posing.html _site/guides/
          echo 'app.thelfmethod.com' > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
